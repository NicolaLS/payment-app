name: CI

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

on:
  push:
    branches: [main, release/rayl/1.0, release/blip/1.0]
  pull_request:
    branches: [main, release/rayl/1.0, release/blip/1.0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting and module boundaries
        run: |
          ./gradlew ktlintCheck verifyModuleDependencies
          ./gradlew -p build-logic ktlintCheck

  android:
    name: ${{ matrix.app }} Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: >-
          ${{ fromJSON(
            (github.base_ref || github.ref_name) == 'release/rayl/1.0' && '["rayl"]' ||
            (github.base_ref || github.ref_name) == 'release/blip/1.0' && '["blip"]' ||
            '["blip", "flint", "lasr", "rayl"]'
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Debug
        run: ./gradlew :${{ matrix.app }}:androidApp:assembleDebug
