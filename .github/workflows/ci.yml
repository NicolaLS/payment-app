name: CI

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Shared checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting and existing tests
        run: ./gradlew ktlintCheck check --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shared-check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  android:
    name: ${{ matrix.app }} Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [blip, lasr]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble and lint
        run: >-
          ./gradlew
          :${{ matrix.app }}:androidApp:assembleDebug
          :${{ matrix.app }}:androidApp:assembleE2e
          :${{ matrix.app }}:androidApp:bundleRelease
          :${{ matrix.app }}:androidApp:lintDebug

      - name: Upload reports and debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-android-results
          path: |
            apps/${{ matrix.app }}/androidApp/build/outputs/apk/debug/
            apps/${{ matrix.app }}/androidApp/build/reports/
          retention-days: 14
