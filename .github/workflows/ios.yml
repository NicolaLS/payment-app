name: iOS

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }} iOS
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [blip, flint, lasr]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and link Kotlin frameworks
        run: >-
          ./gradlew
          :${{ matrix.app }}:shared:iosSimulatorArm64Test
          :${{ matrix.app }}:shared:linkReleaseFrameworkIosSimulatorArm64
          :${{ matrix.app }}:shared:linkReleaseFrameworkIosArm64

      - name: Compile unsigned Xcode Release
        run: |
          xcodebuild build \
            -project apps/${{ matrix.app }}/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-ios-results
          path: |
            apps/${{ matrix.app }}/shared/build/reports/
            apps/${{ matrix.app }}/shared/build/test-results/
          retention-days: 14
