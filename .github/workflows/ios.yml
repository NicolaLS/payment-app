name: iOS

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

on:
  push:
    branches: [main, release/rayl/1.0, release/blip/1.0]
  pull_request:
    branches: [main, release/rayl/1.0, release/blip/1.0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }} iOS
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: >-
          ${{ fromJSON(
            (github.base_ref || github.ref_name) == 'release/rayl/1.0' && '["rayl"]' ||
            (github.base_ref || github.ref_name) == 'release/blip/1.0' && '["blip"]' ||
            '["blip", "flint", "lasr", "rayl"]'
          ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Link simulator Debug framework
        run: ./gradlew :${{ matrix.app }}:shared:linkDebugFrameworkIosSimulatorArm64
