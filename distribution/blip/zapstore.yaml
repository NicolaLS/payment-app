# Use the same suite publisher npub as the root Lasr config.
repository: https://github.com/NicolaLS/lasr
name: Blip
summary: A focused Blink client for Lightning payments
description: |
  Blip connects to one Blink wallet using an API key. Pay Lightning invoices,
  Lightning addresses, and LNURLs without giving Blip custody of funds.
tags:
  - bitcoin
  - lightning
  - finance
license: MIT
icon: icon.png
match: '^blip-[0-9]+\.[0-9]+\.[0-9]+-universal\.apk$'
release_filter: '^blip-v[0-9]+\.[0-9]+\.[0-9]+$'
